# ---------------------------------------------------------------------

"""
AD-01 ⑤ 처리 대기 요약 + 관리자 메뉴 배지를 한 번에 (인수인계 5-1 'adminDashboardSummary', AD-01 비고 '배지 숫자는 한 번에 받아 공유')
"""
type AdminDashboardSummary {
  pendingMemberCount: Int!
  """
  ⑤ '이번 주 미달' — 가장 최근에 실행된 판정 주의 미달 수 (추측)
  목요일 화면(목업 W-15)에서 보이는 판정은 지난 주(9/21~9/27)이므로 용어가 모호하다(계약서 9장 C-13)
  """
  latestWeekFailCount: Int!
  latestJudgedWeekStart: Date
  penaltyTargetCount: Int!
  pendingExemptionRequestCount: Int!
  "자동 재시도가 소진된 미해결 보류 수 — 주차 무관 합계 (제안)"
  heldJudgmentCount: Int!
}

"AD-01 ⑦ 집계: 통과 · 미달 · 면제 · 첫 참가 (+ 보류 ⑧)"
type JudgmentCounts {
  pass: Int!
  fail: Int!
  exempt: Int!
  firstWeek: Int!
  "팀 없음 제외 — 화면 집계에는 없다 (추측: 목록 기본 필터에서도 뺀다)"
  noTeam: Int!
  "0이면 보류 관련 표시를 하지 않는다(AD-01 ⑧)"
  hold: Int!
}

"AD-01 ⑦ 회원별 행. 팀 이름은 넣지 않는다(기능명세서 9장)"
type AdminJudgmentRow {
  judgment: WeeklyJudgment!
  member: Member!
  "'누적 경고' 열 — 그 주 당시가 아니라 현재 값"
  activeWarningCount: Int!
  isPenaltyTarget: Boolean!
  "HOLD 이고 API_ERROR일 때만 true. IDENTITY_MISMATCH는 재시도해도 안 풀린다(E-08)"
  canRetry: Boolean!
  "확정 상태면 true → [정정]. HOLD면 false → [재시도](AD-01 ⑦)"
  canCorrect: Boolean!
}

type AdminJudgmentConnection {
  nodes: [AdminJudgmentRow!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

"AD-01 ⑥⑦ 한 주차의 판정 결과"
type AdminJudgmentWeek {
  weekStart: Date!
  weekEnd: Date!
  "판정 실행 시각. 판정 전 주간이면 null → '이번 주 판정은 월요일 오전에 실행돼요.'(5-4-9)"
  executedAt: DateTime
  counts: JudgmentCounts!
  "회원 검색: 닉네임 · GitHub 아이디(AD-01 ⑥)"
  rows(
    filter: AdminJudgmentFilter = ALL
    search: String
    first: Int = 20
    after: String
  ): AdminJudgmentConnection!
}

"""
재계산 미리보기 — 계산만 하고 아무것도 바꾸지 않는다(기능명세서 7장)
쓰는 곳: 판정 정정(AD-01 ⑩) · 경고 복구(②-1 ⑧) · 소급 면제(②-3 ⑥ 과거 주간, ⑦ 소급 승인)
"""
type RecalcPreview {
  member: Member!
  warningCountBefore: Int!
  warningCountAfter: Int!
  penaltyChange: PenaltyChange!
  "'다시 계산되는 주차 n주'(목업 W-15)"
  affectedWeekCount: Int!
  "벌칙 이행 체크 이전 주차라 기록만 바뀌고 경고 수는 그대로(E-58 · E-59)"
  frozenByFulfillment: Boolean!
  "카테고리가 하나도 없는 경고 복구 → '삭제된 팀'(E-43)"
  restoresWithoutCategory: Boolean!
  """
  반영 직전 서버 재검증용 기준값 (제안 — AD-01 ⑩ 비고). 반영 뮤테이션에 expectedBasis로 돌려준다.
  인수인계 5-2 '잘라낼 순서 3번'이라 nullable · 선택 인자로 둬서 잘라도 스키마가 바뀌지 않게 한다
  """
  basis: String
}

"면제 기간 소급 등록 · 수정 · 삭제 미리보기 (제안 — 인수인계의 신설 5개에 없던 것)"
type ExemptionPeriodPreview {
  weekStart: Date!
  "이미 판정된 주인가. false면 재계산 없음 → 바로 등록"
  isRetroactive: Boolean!
  affectedMemberCount: Int!
  changes: [RecalcPreview!]!
  basis: String
}

"AD-01 ②-1 ⑤ 벌칙 대상. 경고가 붙은 팀은 비공개여도 실명"
type PenaltyTarget {
  member: Member!
  activeWarningCount: Int!
  "DB penalty_fulfillment.reached_week 의미(그 주 월요일). 목업 W-16 '도달 9/28'은 판정일로 보인다(계약서 9장 C-14)"
  reachedWeekStart: Date!
  reachedAt: DateTime
  teams: [AdminTeamLabel!]!
}

"AD-01 ②-1 ⑦ 삭제된 경고(추방 · 팀 삭제로 카테고리가 모두 빠진 것). 회수된 경고는 나오지 않는다"
type DeletedWarning {
  id: ID!
  member: Member!
  weekStart: Date!
  weekEnd: Date!
  deleteReason: WarningDeleteReason!
  deletedAt: DateTime!
  "'복구 후 카테고리'. isDeleted 팀은 '삭제된 팀'"
  restoreCategories: [AdminTeamLabel!]!
}

type DeletedWarningConnection {
  nodes: [DeletedWarning!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

"AD-01 ②-2 가입 승인 행. status는 이 타입에서만 노출"
type AdminMemberRow {
  member: Member!
  status: MemberStatus!
  "신청 = 첫 로그인 시각(DB member.created_at)"
  appliedAt: DateTime!
}

type AdminMemberConnection {
  nodes: [AdminMemberRow!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

"보류 재실행 결과 → 토스트 '{n}명 처리했어요.'(E-35)"
type RerunResult {
  processedCount: Int!
  stillHeldCount: Int!
  rows: [AdminJudgmentRow!]!
}


# ---------------------------------------------------------------------
# 12. 입력 타입
# ---------------------------------------------------------------------

input PostSectionsInput {
  problem: String
  cause: String
  solution: String
  did: String
  learned: String
}

input CreatePostInput {
  type: PostType!
  "1~60자"
  title: String!
  "글 종류에 해당하는 항목만 쓰이고 나머지는 무시된다"
  sections: PostSectionsInput!
  "최대 5개, 개당 20자"
  tags: [String!]
  "https://github.com/{owner}/{repo}/commit/{sha} 형식만 허용. 실제 존재 여부는 확인하지 않는다"
  commitUrls: [String!]
  "연결할 팀 id (선택). 지금 내가 소속인 삭제되지 않은 팀만 가능하고, 아니면 POST_TEAM_INVALID"
  teamId: ID
}

"모든 값을 통째로 바꾼다. 생략한 tags·commitUrls·teamId는 비워진다. 팀장이 남의 글을 고칠 때 teamId는 무시된다"
input UpdatePostInput {
  title: String!
  sections: PostSectionsInput!
  tags: [String!]
  commitUrls: [String!]
  teamId: ID
}

input CreateTeamInput {
  "1~20자"
  name: String!
  "100자 이내 (선택)"
  description: String
  "생략하면 공개"
  isPublic: Boolean
}

input UpdateTeamInput {
  isPublic: Boolean!
}

input CorrectJudgmentInput {
  judgmentId: ID!
  newStatus: CorrectableJudgmentStatus!
  "필수(DB 1-14)"
  reason: String!
  expectedBasis: String
}

input ExemptionPeriodInput {
  weekStart: Date!
  reason: String!
  expectedBasis: String
}

input NoticeInput {
  "1~200자"
  title: String!
  content: String!
  "상단 고정. 기본 false"
  isPinned: Boolean = false
}


# ---------------------------------------------------------------------
# 13. 뮤테이션 결과 타입
# ---------------------------------------------------------------------

"판정 정정 · 경고 복구 · 이행 체크 · 소급 면제 후 영향받은 회원의 새 상태. 프론트는 이 결과로 부분 패치하지 않고 관련 쿼리를 재조회한다"
type RecalcPayload {
  member: Member!
  warningState: WarningState!
  "판정 정정이면 바뀐 판정"
  judgment: WeeklyJudgment
}


# ---------------------------------------------------------------------
# 14. Query
# ---------------------------------------------------------------------

type Query {
  # --- 공통 ----------------------------------------------------------
  "내 계정 정보. 승인 대기·거절 계정도 호출할 수 있다"
  me: Me!

  # --- 내 활동 (AC-01 · AC-02 · CM-01) --------------------------------
  "내 주간 활동. weekStart는 월요일(yyyy-MM-dd), 생략하면 이번 주, 미래 주는 INVALID_INPUT"
  myWeeklyActivity(weekStart: String): WeeklyActivity!
  "내 지난 판정 목록 (AC-01 ⑤). 최근 주부터 커서 기반 20개"
  myJudgmentHistory(after: String): JudgmentHistoryPage!
  "내 경고 요약. 판정 보류가 남아 있으면 onHold만 true이고 숫자는 null"
  myWarningSummary: WarningSummary!
  "내 경고 이력 (AC-02 ③). 최근 주부터 커서 기반 20개"
  myWarningHistory(after: String): WarningHistoryPage!

  # --- 팀 (TM-01~TM-08, 백엔드 team · team-board · team-post · exemption) ---
  "내 팀 목록 (TM-01). 참가한 순서(오래된 순). 커서 없이 전부"
  myTeams: [Team!]!
  "팀 기본 정보. 그 팀의 팀원·팀장과 시스템 관리자만. 없는/삭제된 팀 NOT_FOUND, 비소속 FORBIDDEN"
  team(id: ID!): Team!
  "팀원 목록 (TM-06). 팀장이 맨 앞, 나머지는 참가한 순서. 커서 기반 20개"
  teamMembers(teamId: ID!, after: String): TeamMemberPage!
  "초대코드 다시 확인 (TM-06). 그 팀의 팀장과 시스템 관리자만"
  teamInviteCode(teamId: ID!): String!
  "받은 초대 목록 (TM-04). 최신순, 커서 기반 20개"
  receivedTeamInvitations(after: String): ReceivedTeamInvitationPage!
  "보낸 초대 중 대기 중인 목록 (TM-06). 팀장과 시스템 관리자만. 최신순, 커서 기반 20개"
  sentTeamInvitations(teamId: ID!, after: String): SentTeamInvitationPage!
  "팀 현황판 (TM-05). 그 팀의 팀원·팀장과 시스템 관리자만"
  teamBoard(teamId: ID!): TeamBoard!
  "팀에 연결된 글 목록 (TM-06 ⑧). 팀장만. 최신순, 커서 기반 20개"
  teamPosts(teamId: ID!, after: String): TeamPostPage!
  "팀에 연결된 글에 달린 댓글 목록 (TM-06 ⑧). 팀장만. 최신순, 커서 기반 20개"
  teamComments(teamId: ID!, after: String): TeamCommentPage!
  "내가 보낸 개인 면제 요청 목록 (TM-08 ⑤). 최신순 커서 기반 20개"
  myPersonalExemptionRequests(after: String): PersonalExemptionPage!

  # --- 프로필 (PR-01) ------------------------------------------------
  "없는 회원 → null(E-53). 프로필 화면은 profile을 쓴다 (다른 영역이 아직 쓴다)"
  member(id: ID!): Member
  "프로필 (승인된 회원 누구나, 본인 · 타인 같은 모양). 없는 회원이나 승인되지 않은 회원은 NOT_FOUND"
  profile(memberId: ID!): Profile!

  # --- 게시판 (BD-01 · BD-03 · BD-04, 헤더 검색) ----------------------
  """
  게시판 목록. 최신순, 커서 기반 20개.
  tag는 정확히 일치하는 태그, q는 제목·내용·태그 검색(앞뒤 공백 제외 2~50자, 공백으로 나눈 단어를 모두 포함한 글).
  q·tag는 함께 쓰면 둘 다 만족하는 글만 나온다
  """
  posts(type: PostType!, tag: String, q: String, "이전 페이지의 nextCursor" after: String): PostPage!
  "글 상세. 없으면 NOT_FOUND, 삭제된 글은 POST_DELETED"
  post(id: ID!): Post!
  "태그 필터에 보여줄 많이 쓰인 태그 상위 10개. type을 생략하면 두 종류 전체"
  popularTags(type: PostType): [TagCount!]!

  # --- 공지 (NT-01 · NT-02 · CM-01 ⑦) --------------------------------
  "공지 목록. 고정 공지가 위, 그 아래 최신순. 커서 기반 20개 (백엔드 notice.graphqls)"
  notices(after: String): NoticePage!
  "공지 상세. 없는 공지는 NOT_FOUND"
  notice(id: ID!): Notice!

  # --- 관리자 (AD-01, ADMIN만) ----------------------------------------
  adminDashboardSummary: AdminDashboardSummary!
  "AD-01 ⑥⑦. weekStart 생략 = 가장 최근 판정 주"
  adminJudgmentWeek(weekStart: Date): AdminJudgmentWeek!
  "AD-01 ⑨ 주차와 무관한 미해결 보류 전체 (인수인계 5-1 명칭 유지, 제안: 지난 주차 보류가 묻히지 않게)"
  heldJudgments: [AdminJudgmentRow!]!
  "AD-01 ⑩ (인수인계 5-1 명칭)"
  judgmentCorrectionPreview(
    judgmentId: ID!
    newStatus: CorrectableJudgmentStatus!
  ): RecalcPreview!
  "AD-01 ②-1 ⑤"
  penaltyTargets: [PenaltyTarget!]!
  "AD-01 ②-1 ⑦"
  deletedWarnings(first: Int = 20, after: String): DeletedWarningConnection!
  "AD-01 ②-1 ⑧ (인수인계 5-1 명칭). E-42 · E-43 · E-59"
  restoreWarningPreview(warningId: ID!): RecalcPreview!
  "AD-01 ②-2"
  adminMembers(
    filter: AdminMemberFilter = PENDING
    search: String
    first: Int = 20
    after: String
  ): AdminMemberConnection!
  "AD-01 ②-3 ⑤"
  exemptionPeriods(first: Int = 20, after: String): ExemptionPeriodConnection!
  "AD-01 ②-3 ⑥ 과거 주간 등록 · 수정 · 삭제 전 미리보기 (제안). 수정이면 periodId, 삭제면 removing: true"
  exemptionPeriodPreview(
    weekStart: Date!
    periodId: ID
    removing: Boolean = false
  ): ExemptionPeriodPreview!
  "AD-01 ②-3 ⑦"
  personalExemptionRequests(
    status: PersonalExemptionStatus = PENDING
    first: Int = 20
    after: String
  ): PersonalExemptionRequestConnection!
  "AD-01 ②-3 ⑦ 이미 판정된 주의 승인(소급) 미리보기. 소급이 아니면 null (추측)"
  personalExemptionApprovalPreview(requestId: ID!): RecalcPreview
  "AD-01 ②-5. 검색: 제목 · 내용 · 작성자"
  adminContents(
    filter: AdminContentFilter = ALL
    search: String
    first: Int = 20
    after: String
  ): ContentRowConnection!
}


# ---------------------------------------------------------------------
# 15. Mutation
# ---------------------------------------------------------------------

type Mutation {
  # --- 인증 (AU-02 · AU-03) -------------------------------------------
  "GitHub 로그인 뒤 받은 일회용 코드를 액세스 토큰으로 바꾼다. 한 번만 쓸 수 있다. 재사용 · 만료 AUTH_CODE_INVALID, 거절 회원 ACCOUNT_REJECTED"
  exchangeAuthCode(code: String!): AuthPayload!

  # --- 팀 (백엔드 team.graphqls · exemption.graphqls) ------------------
  "팀을 만든다. 만든 사람이 팀장이고, 초대코드가 이때 한 번 발급된다 (TM-02)"
  createTeam(input: CreateTeamInput!): CreateTeamPayload!
  "팀의 공개·비공개를 바꾼다 (팀장과 시스템 관리자만, TM-06 ⑦)"
  updateTeam(teamId: ID!, input: UpdateTeamInput!): Team!
  "초대코드로 참가한다 (TM-03). TEAM_CODE_NOT_FOUND · TEAM_ALREADY_JOINED · TEAM_JOIN_BLOCKED"
  joinTeamByCode(code: String!): Team!
  "GitHub 아이디로 초대한다 (TM-06). INVITEE_NOT_FOUND · INVITEE_ALREADY_MEMBER · INVITATION_DUPLICATE"
  inviteToTeam(teamId: ID!, githubLogin: String!): SentTeamInvitation!
  "보낸 초대를 철회한다 (팀장과 시스템 관리자만)"
  cancelTeamInvitation(invitationId: ID!): Boolean!
  "받은 초대를 수락해 바로 참가한다 (TM-04). INVITATION_ALREADY_JOINED · TEAM_GONE"
  acceptTeamInvitation(invitationId: ID!): Team!
  "받은 초대를 거절한다"
  declineTeamInvitation(invitationId: ID!): Boolean!
  "팀원을 추방한다 (팀장과 시스템 관리자만)"
  kickTeamMember(teamId: ID!, memberId: ID!): Boolean!
  "팀에서 나간다. 팀장은 LEADER_MUST_TRANSFER, 혼자면 LEADER_LAST_MEMBER"
  leaveTeam(teamId: ID!): Boolean!
  "팀장을 다른 팀원에게 넘긴다 (팀장과 시스템 관리자만). 되돌릴 수 없다"
  transferTeamLeadership(teamId: ID!, newLeaderId: ID!): Team!
  "팀을 삭제한다 (팀장과 시스템 관리자만)"
  deleteTeam(teamId: ID!): Boolean!
  "개인 면제를 요청한다 (그 팀의 팀장만, TM-08). EXEMPTION_REQUEST_DUPLICATE. weekStart는 월요일 yyyy-MM-dd"
  requestPersonalExemption(teamId: ID!, memberId: ID!, weekStart: String!, reason: String!): PersonalExemption!

  # --- 게시판 ---------------------------------------------------------
  "글을 쓴다. 필수 항목을 모두 채우지 않아도 저장되지만 기록글로 인정되지 않는다(isRecord=false)"
  createPost(input: CreatePostInput!): Post!
  """
  글을 고친다 (작성자 본인 또는 그 글이 연결된 팀의 현재 팀장). 글 종류와 작성일은 바뀌지 않는다.
  팀장이 남의 글을 고칠 때는 teamId를 읽지 않고 기존 팀 연결을 유지한다. 그 밖의 사람은 FORBIDDEN
  """
  updatePost(id: ID!, input: UpdatePostInput!): Post!
  "글을 지운다 (작성자 본인만, 소프트 삭제). 팀장도 지울 수 없다"
  deletePost(id: ID!): Boolean!
  "댓글을 쓴다. 삭제된 글에는 달 수 없다 (1~500자)"
  createComment(postId: ID!, content: String!): Comment!
  "댓글을 고친다 (작성자 본인 또는 그 글이 연결된 팀의 현재 팀장)"
  updateComment(id: ID!, content: String!): Comment!
  "댓글을 지운다 (작성자 본인만, 소프트 삭제). 팀장도 지울 수 없다"
  deleteComment(id: ID!): Boolean!
  "글을 삭제한다 (관리자, 소프트 삭제). 이미 삭제된 글은 POST_DELETED, 없는 글은 NOT_FOUND. 관리자 행동 로그가 남는다"
  adminDeletePost(postId: ID!): Boolean!
  "댓글을 삭제한다 (관리자, 소프트 삭제). 없거나 이미 삭제된 댓글은 NOT_FOUND. 관리자 행동 로그가 남는다"
  adminDeleteComment(commentId: ID!): Boolean!

  # --- 프로필 ---------------------------------------------------------
  "PR-02 ③ 기본 이미지로. 파일 업로드는 REST(계약서 5장)"
  resetProfileImage: Member!

  # --- 관리자: 판정 (AD-01 대시보드) ----------------------------------
  "AD-01 ⑦ [재시도] · ⑨ [전체 재시도]. judgmentIds 생략 = 재시도 가능한 보류 전부. 확정 건은 건드리지 않는다(E-35)"
  rerunHeldJudgments(judgmentIds: [ID!]): RerunResult!
  "AD-01 ⑩ [정정하고 재계산]. 사유 필수. 연쇄 재계산(E-49 · E-50 · E-58 · E-60)"
  correctJudgment(input: CorrectJudgmentInput!): RecalcPayload!

  # --- 관리자: 경고 복구 · 벌칙 ---------------------------------------
  "AD-01 ②-1 ⑥ 되돌릴 수 없는 고정점(E-58). 경고 0 · 연속 0 [Q-10 ⓓ]"
  fulfillPenalty(memberId: ID!): RecalcPayload!
  "AD-01 ②-1 ⑧"
  restoreWarning(warningId: ID!, expectedBasis: String): RecalcPayload!

  # --- 관리자: 가입 승인 ----------------------------------------------
  approveMember(memberId: ID!): AdminMemberRow!
  "확인 다이얼로그 후. 감사 기록 대상(기능명세서 9장)"
  rejectMember(memberId: ID!): AdminMemberRow!
  "거절 → 승인 대기로 되돌리기(AD-01 ②-2 ⑧)"
  revertMemberToPending(memberId: ID!): AdminMemberRow!

  # --- 관리자: 면제 ---------------------------------------------------
  "과거 주간이면 exemptionPeriodPreview를 먼저 거친다(AD-01 ②-3 ⑥, E-45)"
  createExemptionPeriod(input: ExemptionPeriodInput!): ExemptionPeriod!
  updateExemptionPeriod(id: ID!, input: ExemptionPeriodInput!): ExemptionPeriod!
  "[미결] 이미 판정된 주의 면제 기간을 지우면 그 주를 어떻게 판정할지 명세에 없다(계약서 9장 C-05)"
  deleteExemptionPeriod(id: ID!, expectedBasis: String): ID!
  "AD-01 ②-3 ⑦ [승인]. 소급이면 미리보기 후 (추측)"
  approvePersonalExemption(requestId: ID!, expectedBasis: String): PersonalExemptionRequest!
  "거절 사유 필수(E-48 제안)"
  rejectPersonalExemption(requestId: ID!, reason: String!): PersonalExemptionRequest!

  # --- 관리자: 공지 ---------------------------------------------------
  createNotice(input: NoticeInput!): Notice!
  updateNotice(id: ID!, input: NoticeInput!): Notice!
  "isSystem이면 SYSTEM_NOTICE_UNDELETABLE(EX-AD01-02)"
  deleteNotice(id: ID!): Boolean!
  "AD-01 ②-4 ⑥ 고정 ON/OFF 즉시 토글"
  setNoticePinned(id: ID!, isPinned: Boolean!): Notice!
}
