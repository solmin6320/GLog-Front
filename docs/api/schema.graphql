# =====================================================================
# 잔디로그(GLog) GraphQL 계약 v0.1
# ---------------------------------------------------------------------
# 상태     : 팀 확정 초안 (2026-10-02). 백엔드 리뷰 전. 3주차 말 스키마 동결 전에 백엔드와 합의한다.
# 기준 문서: 기능명세서 v1.9 · 화면설계서 v0.7 · DB명세서 v0.4 · 목업 v2
# 출발점   : docs/analysis/A3-schema.draft.graphql (A3 API 계약 분석가 초안)
# 설명 문서: docs/01-requirements.md 6장 · docs/analysis/A3-api-contract.md
#
# v0.1에서 초안에 반영한 회의 결과 (docs/01-requirements.md 11장)
#   - M-03  Post.inFinalizedWeek 추가 — E-28 "끝난 주의 글 삭제" 안내를 서버 플래그로 판단한다.
#           클라이언트가 writtenDate < currentWeekStart 로 계산하면 월요일 00:00~판정 실행 사이와
#           보류(HOLD) 주에 틀린 안내가 나간다.
#   - M-02  이름은 이 파일을 기준으로 한다(exchangeAuthCode · PREVIEW_STALE · VALIDATION_FAILED).
#
# 표기 규칙
#   (제안) = 명세에 근거가 없다 / (추측) = 명세 취지에서 도출했다
#   [Q-xx] = 화면설계서 5-4-10 미결 항목이 이 자리의 모양을 흔든다
#   enum 값은 DB ENUM 값과 글자 그대로 같다(DB명세서 1장 · 부록 DDL).
#   화면 라벨(통과 · 미달 · 아직 …)은 프론트가 enum → 문구로 매핑한다(5-2-8 문구 규칙).
#
# 공통 계약
#   - 엔드포인트: POST /graphql 하나. 예외는 프로필 이미지 업로드 REST 1개(기능명세서 8장).
#   - 인증: Authorization: Bearer <JWT>. 비로그인 허용 필드는 exchangeAuthCode 뿐 (me는 토큰 필요)
#   - 권한: 서버 메서드 단위 @PreAuthorize (기능명세서 10장). 화면 가드는 1차 방어일 뿐.
#   - 오류: errors[].extensions.code 에 도메인 코드 (제안). 코드표는 docs/01-requirements.md 6-4.
#   - 예상 가능한 상태(잔디 조회 실패, 삭제된 글, 거절 계정 등)는 오류가 아니라 데이터로 내려준다.
#   - 비공개 팀 이름 마스킹은 서버가 한다. 마스킹된 표기는 id 없는 값 객체(TeamLabel)로만 내려
#     Apollo 정규화 캐시에서 실명 Team 객체와 섞이지 않게 한다.
#   - 목록은 커서 Connection(nodes + pageInfo + totalCount)으로 통일한다 [Q-06].
# =====================================================================


# ---------------------------------------------------------------------
# 0. 스칼라
# ---------------------------------------------------------------------

"""
yyyy-MM-dd. 항상 한국시간(Asia/Seoul) 날짜다(기능명세서 5장, DB 1-0).
주차는 그 주 월요일 Date 하나로 식별한다(DB 1-0 주차 표기).
"""
scalar Date

"""
ISO-8601 + 오프셋. 예: 2026-09-29T14:20:00+09:00 (제안)
DB DATETIME은 KST 값이라 서버가 +09:00 오프셋을 붙여 보낸다.
"""
scalar DateTime


# ---------------------------------------------------------------------
# 1. DB와 1:1로 대응하는 enum (값을 바꾸지 않는다)
# ---------------------------------------------------------------------

"DB member.status (1-1)"
enum MemberStatus {
  PENDING
  ACTIVE
  REJECTED
}

"DB member.role (1-1)"
enum MemberRole {
  MEMBER
  ADMIN
}

"DB post_index.post_type · posts.type (1-5, 3-1). URL 쿼리(?type=troubleshooting|devlog)는 소문자이므로 라우터에서 변환한다"
enum PostType {
  TROUBLESHOOTING
  DEVLOG
}

"DB weekly_judgment.status (1-6). HOLD는 확정 상태가 아니다(E-35)"
enum JudgmentStatus {
  PASS
  FAIL
  EXEMPT
  EXCLUDED
  HOLD
}

"""
DB weekly_judgment.skip_reason (1-6).
EXCLUDED ↔ NO_TEAM · FIRST_WEEK / EXEMPT ↔ EXEMPTION_PERIOD · PERSONAL_EXEMPTION (DB 1-6 대응표, 고정)
화면: FIRST_WEEK = "첫 참가"(AC-01 ⑤ · 목업 W-06 배지), NO_TEAM = "제외"
"""
enum SkipReason {
  NO_TEAM
  FIRST_WEEK
  EXEMPTION_PERIOD
  PERSONAL_EXEMPTION
}

"DB weekly_judgment.hold_reason (1-6). IDENTITY_MISMATCH는 재시도로 풀리지 않는다(E-08)"
enum HoldReason {
  API_ERROR
  IDENTITY_MISMATCH
}

"DB judgment_correction.after_status (1-14). 정정으로 만들 수 있는 결과 3종(기능명세서 7장) [Q-05: B안이면 EXCLUDED 추가]"
enum CorrectableJudgmentStatus {
  PASS
  FAIL
  EXEMPT
}

"""
DB warning.delete_reason (1-9).
[충돌] FC-04는 정정·소급 면제로 '회수'된 경고를 사유를 구분해 저장한다고 적었으나 DB에는 이 두 값뿐이다.
회수를 소프트 삭제로 남긴다면 RETRACTED 같은 값이 필요하다 (제안 — 계약서 9장 C-03)
"""
enum WarningDeleteReason {
  KICKED
  TEAM_DELETED
}

# DB team_invitation.status (PENDING / ACCEPTED / DECLINED, 1-4)는 노출하지 않는다.
# 화면은 대기 중인 초대만 보여준다(TM-04 ①, TM-06 ③). 필요해지면 같은 값으로 enum InvitationStatus를 추가한다.

"DB personal_exemption.status (1-13). 초대(DECLINED)와 단어가 다르지만 DB 그대로 둔다"
enum PersonalExemptionStatus {
  PENDING
  APPROVED
  REJECTED
}


# ---------------------------------------------------------------------
# 2. 서버 계산 값 enum (DB 컬럼이 아니다)
# ---------------------------------------------------------------------

"""
판정 전(진행 중) 주의 상태 (제안)
확정 판정(JudgmentStatus)과 섞지 않는다 — '보류는 진행 중과 다른 상태'(AD-01 ②-0 비고).
TM-05 상태 칸: CONDITION_MET="통과", NOT_YET="아직", EXCLUDED/EXEMPT="제외"(TM-05 비고 제안)
CM-01 ③ · AC-01 ④: CONDITION_MET="이번 주는 통과 예정이에요"
"""
enum LiveWeekStatus {
  CONDITION_MET
  NOT_YET
  EXCLUDED
  EXEMPT
}

"""
잔디 조회 상태 (제안). 실패를 오류가 아니라 데이터로 내려 화면 일부만 대체한다.
FAILED = E-32 "잔디를 아직 못 불러왔어요" / IDENTITY_MISMATCH = E-08 "GitHub 아이디가 바뀌었어요"
"""
enum GrassFetchStatus {
  OK
  FAILED
  IDENTITY_MISMATCH
}

"""
경고 한 건의 현재 상태 (추측 — DB 4-3 재계산 결과에서 파생, 저장 컬럼 아님)
ACTIVE="유효" · DEDUCTED="차감됨" (AC-02 ③, 목업 W-07)
FULFILLED="이행 완료" [Q-13 A안일 때만 쓴다. B안이면 이 값은 내려오지 않고 이력에서 빠진다]
소프트 삭제된 경고는 회원 화면에 나오지 않는다(AC-02 ③).
"""
enum WarningStanding {
  ACTIVE
  DEDUCTED
  FULFILLED
}

"""
경고 카테고리·게시글 팀 표기 종류 (제안)
PRIVATE → "비공개 팀"(열람자 구분 없이 무조건, E-23) / DELETED → "삭제된 팀"(기능명세서 6장, E-43)
"""
enum TeamLabelKind {
  PUBLIC
  PRIVATE
  DELETED
}

"재계산 미리보기의 벌칙 대상 변화 (AD-01 ⑩ '벌칙 진입·해제', E-42 · E-50)"
enum PenaltyChange {
  NONE
  ENTER
  RELEASE
}

"AD-01 ⑥ 결과 필터: 전체 / 미달만 / 보류만"
enum AdminJudgmentFilter {
  ALL
  FAIL
  HOLD
}

"AD-01 ②-2 ⑤ 상태 필터: 승인 대기 / 거절 / 전체 (추측: '전체' = 대기 + 거절)"
enum AdminMemberFilter {
  PENDING
  REJECTED
  ALL
}

"글 + 댓글 혼합 목록의 행 종류 (AD-01 ②-5, TM-06 ⑧)"
enum ContentKind {
  POST
  COMMENT
}

"AD-01 ②-5 ⑤ 종류 필터: 글 + 댓글 / 글만 / 댓글만"
enum AdminContentFilter {
  ALL
  POST
  COMMENT
}


# ---------------------------------------------------------------------
# 3. 공통 타입
# ---------------------------------------------------------------------

"[Q-06] 커서 방식 초안. 오프셋으로 결정되면 이 타입과 각 Connection만 바뀌고, 프론트는 페이지 훅 안에서 흡수한다"
type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

"""
마스킹된 팀 표기용 값 객체 (제안)
일부러 id 필드를 두지 않는다 — 실명 Team:{id}와 같은 캐시 키로 합쳐지면 실명이 새거나 TM-01 이름이 깨진다.
name은 PUBLIC일 때만 값이 있다. PRIVATE·DELETED는 프론트가 고정 문구로 그린다.
"""
type TeamLabel {
  kind: TeamLabelKind!
  name: String
}

"관리자 전용 팀 표기. 비공개 팀도 실명이다 — 경고 복구 · 벌칙 화면에만 쓴다(기능명세서 9장, AD-01 ②-1)"
type AdminTeamLabel {
  teamId: ID!
  name: String!
  isPublic: Boolean!
  isDeleted: Boolean!
}


# ---------------------------------------------------------------------
# 4. 회원 · 본인
# ---------------------------------------------------------------------

"""
회원 공개 프로필. 작성자·팀원 표시와 PR-01이 같은 정규화 단위(Member:{id})를 쓴다.
status·role은 여기 두지 않는다 — 본인은 Me, 관리자는 AdminMemberRow로만 본다 (제안)
"""
type Member {
  id: ID!
  "표시 이름(DB nickname). PR-01 ②"
  nickname: String!
  "GitHub 아이디. 로그인마다 최신값으로 갱신(DB 1-1). PR-01 ③"
  githubLogin: String!
  "null이면 기본 이미지(DB 1-1, 기능명세서 8장)"
  profileImageUrl: String

  "PR-01 ⑥ (DB 4-5: MongoDB 집계, 삭제 글 제외)"
  postCount: Int!
  commentCount: Int!

  "PR-01 ⑦ 최근 12개월 잔디. 하루 1회 캐시 값(기능명세서 5장, 5-2-6)"
  grassCalendar: GrassCalendar!

  "PR-01 ⑧⑨ · CM-01 ④ · AC-02 ①② — 타인 프로필에서도 같은 값을 보인다(PR-01 '상태: 타인')"
  warningState: WarningState!

  "PR-01 ⑩ 첫 줄 '진행 중'. 이번 주 판정 대상이 아니면(팀 미소속) null"
  currentWeek: WeekActivity

  "PR-01 ⑩ · AC-01 ⑤ 확정·보류된 주차 이력, 최신순. 기본 8주(PR-01 ⑩ 제안) [Q-06]"
  judgmentHistory(first: Int = 8, after: String): WeeklyJudgmentConnection!

  "PR-01 ⑫ 공개 팀만. 비공개 팀은 항목째 뺀다(기능명세서 2장, PR-01 비고)"
  publicTeams: [Team!]!
}

# 로그인 · 본인 (백엔드 auth.graphqls와 같은 정의). 팀 유무 · 받은 초대 수는 myTeams · receivedTeamInvitations로 센다.
# 서버 시각 API는 없다 — 프론트 세션이 브라우저(목 모드는 목 기준) 시각으로 이번 주를 계산한다

type Me {
  id: ID!
  githubLogin: String!
  nickname: String!
  profileImageUrl: String
  status: MemberStatus!
  role: MemberRole!
}

type AuthPayload {
  accessToken: String!
  "액세스 토큰 유효 시간(초)"
  expiresIn: Int!
  me: Me!
}


# 프로필 (백엔드 profile.graphqls · profile-warning.graphqls · profile-history.graphqls와 같은 정의, PR-01).
# 본인 · 타인이 같은 모양이다. 사진 변경은 백엔드에서 보류 중이다

type Profile {
  id: ID!
  "GitHub 계정 이름. 수정할 수 없다"
  nickname: String!
  githubLogin: String!
  "null이면 기본 이미지"
  profileImageUrl: String
  "내 프로필인가 (프로필 수정 · 관리자 메뉴 버튼 노출 판단)"
  isMine: Boolean!
  postCount: Int!
  commentCount: Int!
  "GitHub 잔디 1년치. 캐시가 없으면 null (E-32). 하루 한 번 갱신한 캐시다"
  grass: ProfileGrass
  "경고 합계 카드 (n / 3)"
  warning: ProfileWarning!
  "소속 팀. 공개 팀만 나오고 비공개 팀은 빠진다"
  teams: [ProfileTeam!]!
  "팀별 경고 (PR-01 ⑨). 중복 집계"
  teamWarnings: ProfileTeamWarnings!
  "주간 판정 이력 (PR-01 ⑩). 최근 주부터 커서 기반 20개. 첫 페이지 맨 위에 이번 주 IN_PROGRESS 행이 하나 더 붙을 수 있다"
  judgmentHistory(after: String): ProfileJudgmentPage!
}

type ProfileGrass {
  "캐시가 덮는 첫 날 (yyyy-MM-dd)"
  from: String!
  "캐시가 덮는 마지막 날 (yyyy-MM-dd)"
  to: String!
  "갱신 기준 시각 (KST, ISO-8601). '오늘 오전 6시 기준'에 쓴다"
  fetchedAt: String!
  "날짜 오름차순, 날짜마다 기여 수 (0이면 잔디 없음)"
  days: [ProfileGrassDay!]!
}

type ProfileGrassDay {
  date: String!
  count: Int!
}

"보류 주가 남아 있으면 onHold만 true이고 나머지는 null"
type ProfileWarning {
  onHold: Boolean!
  "벌칙 이행 이후 살아 있고 차감되지 않은 경고 수. 3을 넘을 수 있다"
  warningCount: Int
  "경고 3개 이상이면 벌칙 대상 (E-40)"
  penaltyTarget: Boolean
}

type ProfileTeam {
  id: ID!
  name: String!
}

type ProfileTeamWarnings {
  onHold: Boolean!
  "공개 팀(이름순) → 비공개 팀 → 삭제된 팀 순"
  teams: [ProfileTeamWarning!]!
}

"비공개 팀은 '비공개 팀', 삭제된 팀은 '삭제된 팀'으로 나온다"
type ProfileTeamWarning {
  name: String!
  count: Int!
}

"PASS 통과 / FAIL 미달(경고) / EXEMPT 면제 / EXCLUDED 제외 / IN_PROGRESS 진행 중(이번 주와 아직 확정되지 않은 보류 주)"
enum ProfileJudgmentResult {
  PASS
  FAIL
  EXEMPT
  EXCLUDED
  IN_PROGRESS
}

"면제 · 제외 주와 보류 주는 인증일 · 기록글이 null"
type ProfileJudgmentWeek {
  weekStart: String!
  weekEnd: String!
  result: ProfileJudgmentResult!
  "인증일 수. 진행 중인 이번 주는 잔디 캐시가 없으면 null"
  verifiedDays: Int
  recordCount: Int
}

type ProfileJudgmentPage {
  items: [ProfileJudgmentWeek!]!
  "다음 페이지 커서. null이면 마지막"
  nextCursor: String
}


# 주간 활동 · 판정 · 경고 (백엔드 judgment.graphqls · warning.graphqls · warning-history.graphqls와 같은 정의)

"판정에서 빠진 이유. NO_TEAM·FIRST_WEEK은 제외, EXEMPTION_PERIOD·PERSONAL_EXEMPTION은 면제"
enum JudgmentSkipReason {
  NO_TEAM
  FIRST_WEEK
  EXEMPTION_PERIOD
  PERSONAL_EXEMPTION
}

"보류 이유. API_ERROR는 재시도로 풀리고 IDENTITY_MISMATCH는 본인이 다시 로그인해야 풀린다"
enum JudgmentHoldReason {
  API_ERROR
  IDENTITY_MISMATCH
}

"이번 주 화면 상단 배너 후보. 동시에 해당하면 위에서부터 하나만 내려온다"
enum ActivityBanner {
  "GitHub 비공개 기여 표시가 꺼진 듯함 (E-39)"
  CONTRIBUTIONS_HIDDEN
  "잔디를 아직 못 불러옴 (E-32)"
  GRASS_NOT_LOADED
  "계정 생애 첫 팀 참가 주 (E-36)"
  FIRST_WEEK
  "면제 주간 (E-46)"
  EXEMPTION_WEEK
}

type WeeklyActivity {
  "그 주 월요일 (yyyy-MM-dd)"
  weekStart: String!
  "그 주 일요일 (yyyy-MM-dd)"
  weekEnd: String!
  currentWeek: Boolean!
  "지금 소속된 팀이 있는가. 없으면 판정 대상이 아니다"
  inTeam: Boolean!
  "월~일 7행"
  days: [ActivityDay!]!
  "인증일 수. 잔디를 못 불러와 알 수 없으면 null"
  verifiedDays: Int
  recordCount: Int!
  requiredVerifiedDays: Int!
  requiredRecordCount: Int!
  "이번 주 통과 예정인가. 이번 주를 볼 때만 있고 인증일을 모르면 null"
  passExpected: Boolean
  "잔디 캐시가 있는가"
  grassAvailable: Boolean!
  "잔디 갱신 기준 시각 (KST, ISO-8601). 저장된 판정을 보여줄 때는 null"
  grassFetchedAt: String
  "이번 주를 볼 때 배너 하나. 없으면 null"
  banner: ActivityBanner
  "그 주의 판정 결과. 아직 판정 전이면 null"
  judgment: WeekJudgment
}

"날짜별 인증 한 행. null은 알 수 없음(안 불러왔거나 갱신 전이거나 저장하지 않은 값)"
type ActivityDay {
  date: String!
  hasGrass: Boolean
  "잔디 기여 수. 판정이 끝난 주는 저장하지 않아 null"
  grassCount: Int
  hasRecord: Boolean!
  "기록글 수. 판정이 끝난 주는 저장하지 않아 null"
  recordCount: Int
}

"한 주의 판정 결과. 제외·면제·보류 주는 인증일·기록글이 null"
type WeekJudgment {
  status: JudgmentStatus!
  skipReason: JudgmentSkipReason
