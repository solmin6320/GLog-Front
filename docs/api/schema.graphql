"""
글 · 댓글 혼합 목록의 한 줄 (AD-01 ②-5 ⑥, TM-06 ⑧) (제안)
글과 댓글이 같은 목록에 섞이므로 정규화하지 않도록 id 필드를 두지 않는다(targetId 사용).
