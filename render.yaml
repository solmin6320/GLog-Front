# Render Blueprint — 정적 사이트. 백엔드 연동 전까지 목 모드로 시연한다.
services:
  - type: web
    name: glog-front
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_MODE
        value: mock
      - key: VITE_API_ORIGIN
        value: ""
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
