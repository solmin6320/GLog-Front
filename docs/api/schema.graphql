# ---------------------------------------------------------------------
# 12. 입력 타입
# ---------------------------------------------------------------------

"BD-01 · 헤더 검색(5-1-0-1) 공통 필터. 헤더 검색은 서버에 따로 묻지 않고 이 필터로 BD-01에 들어온다"
input PostFilter {
  "null이면 종류 무관(관리자 · 프로필용)"
  type: PostType
  tag: String
  "제목 · 내용 · 태그 검색. 앞뒤 공백 제거 후 2~50자(E-61 · E-63)"
  query: String
  "[Q-12] TM-05 ⑧ '전체보기(팀 필터)'. A안이면 사용, B안이면 남겨두고 쓰지 않는다"
  teamId: ID
  "[Q-12] PR-01 ⑥ '작성자 필터'"
  authorId: ID
}

input PostSectionInput {
  key: PostSectionKey!
  body: String
}

"""
글 작성 (BD-04). 필수 항목이 비어도 저장은 허용(E-24 추측) — isRecord는 서버가 계산한다(DB 1-5).
type과 맞지 않는 section key는 VALIDATION_FAILED.
"""
input CreatePostInput {
  type: PostType!
  "1~60자(BD-04 ③ 제안). 제목만 진짜 필수"
  title: String!
  sections: [PostSectionInput!]!
  tags: [String!]!
  "본인이 속한 팀만. null = 연결 안 함(BD-04 ⑨)"
  teamId: ID
}

"""
글 수정. 종류는 바꿀 수 없다(BD-04 ② 제안).
전체 치환(필드 전부 보냄) 방식 (제안) — 'teamId 생략'과 'teamId: null(연결 해제)'을 헷갈리지 않기 위해.
팀장이 남의 글을 수정할 때 teamId는 서버가 무시한다(BD-04 비고: ②⑨ 비활성).
"""
input UpdatePostInput {
  title: String!
  sections: [PostSectionInput!]!
  tags: [String!]!
  teamId: ID
}

input CreateTeamInput {
  "1~20자(TM-02 ① 제안)"
  name: String!
  "100자 이내(TM-02 ② 제안). DB는 200자"
  description: String
  "기본 공개(TM-02 ③)"
  isPublic: Boolean!
}

input RequestPersonalExemptionInput {
  teamId: ID!
  "이 팀 팀원 또는 본인(TM-08 ①)"
  memberId: ID!
  "이번 주 · 다음 주(TM-08 ② 제안)"
  weekStart: Date!
  "200자 이내(TM-08 ③ 제안). DB는 500자"
  reason: String!
}

input CorrectJudgmentInput {
  judgmentId: ID!
  newStatus: CorrectableJudgmentStatus!
  "필수(DB 1-14)"
  reason: String!
  expectedBasis: String
}

input ExemptionPeriodInput {
  weekStart: Date!
  reason: String!
  expectedBasis: String
}

input NoticeInput {
  title: String!
  content: String!
  isPinned: Boolean!
}


# ---------------------------------------------------------------------
# 13. 뮤테이션 결과 타입
# ---------------------------------------------------------------------

"TM-02 ⑤ 초대코드는 이 응답에서만 반드시 온다(1회 발급, 재발급 불가 — 기능명세서 2장)"
type CreateTeamPayload {
  team: Team!
  inviteCode: String!
}

"수락이면 team이 있고 TM-05로 이동, 거절이면 null"
type RespondInvitationPayload {
  invitationId: ID!
  team: Team
}

"판정 정정 · 경고 복구 · 이행 체크 · 소급 면제 후 영향받은 회원의 새 상태. 프론트는 이 결과로 부분 패치하지 않고 관련 쿼리를 재조회한다"
type RecalcPayload {
  member: Member!
  warningState: WarningState!
  "판정 정정이면 바뀐 판정"
  judgment: WeeklyJudgment
}


# ---------------------------------------------------------------------
# 14. Query
# ---------------------------------------------------------------------

type Query {
  # --- 공통 ----------------------------------------------------------
  "서버 시각 · 이번 주 경계 (제안). 비로그인 허용"
  clock: ServerClock!
  "본인. 토큰이 없으면 null. 승인 대기 제한 토큰으로도 조회 가능(AU-03 ④⑤)"
  me: Me

  # --- 내 활동 (AC-01 · AC-02 · CM-01) --------------------------------
  "AC-01 · CM-01 ②③. weekStart 생략 = 이번 주. 미래 주는 VALIDATION_FAILED"
  myWeek(weekStart: Date): WeekActivity!
  "AC-02 · CM-01 ④"
  myWarnings: MyWarnings!

  # --- 팀 (TM-01~TM-08) -----------------------------------------------
  "TM-01 참가 순서(오래된 순, 제안) · BD-04 ⑨ 셀렉트 · TM-04 이후 갱신"
  myTeams: [Team!]!
  "TM-04"
  myInvitations: [ReceivedInvitation!]!
  "TM-05 · TM-06 · TM-08. 없는 팀 → null(E-53), 비소속 → FORBIDDEN(E-09), 관리자도 예외 없음"
  team(id: ID!): Team

  # --- 프로필 (PR-01) ------------------------------------------------
  "없는 회원 → null(E-53)"
  member(id: ID!): Member

  # --- 게시판 (BD-01 · BD-03 · BD-04, 헤더 검색) ----------------------
  "최신순 고정(BD-01 비고 제안). 20개씩(BD-01 ⑪ 제안) [Q-06]"
  posts(filter: PostFilter!, first: Int = 20, after: String): PostConnection!
  "BD-01 ① 검색 시 탭별 건수 (제안)"
  postTypeCounts(filter: PostFilter!): PostTypeCounts!
  "BD-01 ④. type 생략 = 전체 (제안: 현재 탭 기준)"
  popularTags(type: PostType, first: Int = 10): [TagCount!]!
  "BD-03 · BD-04 수정 모드"
  post(id: ID!): PostLookup

  # --- 공지 (NT-01 · NT-02 · CM-01 ⑦) --------------------------------
  "고정 공지가 먼저, 그다음 최신순(NT-01 ①②). CM-01 ⑦은 first: 3"
  notices(first: Int = 20, after: String): NoticeConnection!
  notice(id: ID!): Notice
  "잔디 인정 규칙 공지(isSystem). CM-01 ⑥ · PR-01 E-39 [설정 방법] → NT-02 (제안)"
  grassRuleNotice: Notice

  # --- 관리자 (AD-01, ADMIN만) ----------------------------------------
  adminDashboardSummary: AdminDashboardSummary!
  "AD-01 ⑥⑦. weekStart 생략 = 가장 최근 판정 주"
  adminJudgmentWeek(weekStart: Date): AdminJudgmentWeek!
  "AD-01 ⑨ 주차와 무관한 미해결 보류 전체 (인수인계 5-1 명칭 유지, 제안: 지난 주차 보류가 묻히지 않게)"
  heldJudgments: [AdminJudgmentRow!]!
  "AD-01 ⑩ (인수인계 5-1 명칭)"
  judgmentCorrectionPreview(
    judgmentId: ID!
    newStatus: CorrectableJudgmentStatus!
  ): RecalcPreview!
  "AD-01 ②-1 ⑤"
  penaltyTargets: [PenaltyTarget!]!
  "AD-01 ②-1 ⑦"
  deletedWarnings(first: Int = 20, after: String): DeletedWarningConnection!
  "AD-01 ②-1 ⑧ (인수인계 5-1 명칭). E-42 · E-43 · E-59"
  restoreWarningPreview(warningId: ID!): RecalcPreview!
  "AD-01 ②-2"
  adminMembers(
    filter: AdminMemberFilter = PENDING
    search: String
    first: Int = 20
    after: String
  ): AdminMemberConnection!
  "AD-01 ②-3 ⑤"
  exemptionPeriods(first: Int = 20, after: String): ExemptionPeriodConnection!
  "AD-01 ②-3 ⑥ 과거 주간 등록 · 수정 · 삭제 전 미리보기 (제안). 수정이면 periodId, 삭제면 removing: true"
  exemptionPeriodPreview(
    weekStart: Date!
    periodId: ID
    removing: Boolean = false
  ): ExemptionPeriodPreview!
  "AD-01 ②-3 ⑦"
  personalExemptionRequests(
    status: PersonalExemptionStatus = PENDING
    first: Int = 20
    after: String
  ): PersonalExemptionRequestConnection!
  "AD-01 ②-3 ⑦ 이미 판정된 주의 승인(소급) 미리보기. 소급이 아니면 null (추측)"
  personalExemptionApprovalPreview(requestId: ID!): RecalcPreview
  "AD-01 ②-5. 검색: 제목 · 내용 · 작성자"
  adminContents(
    filter: AdminContentFilter = ALL
    search: String
    first: Int = 20
    after: String
  ): ContentRowConnection!
}


# ---------------------------------------------------------------------
# 15. Mutation
# ---------------------------------------------------------------------

type Mutation {
  # --- 인증 (AU-02 · AU-03) -------------------------------------------
  "비로그인 허용. 코드 재사용 · 만료 → LOGIN_CODE_INVALID(E-05 · E-06)"
  exchangeLoginCode(code: String!): AuthPayload!
  "무상태 JWT라 서버 처리는 없다 (제안). 클라이언트가 토큰 폐기 + 캐시 초기화"
  logout: Boolean!

  # --- 팀 -------------------------------------------------------------
  "TM-02"
  createTeam(input: CreateTeamInput!): CreateTeamPayload!
  "TM-03. E-10 · E-11 · E-12(차단 사유 · 남은 기간 미노출)"
  joinTeamByInviteCode(code: String!): Team!
  "TM-06 ②. 가입 회원만(E-15), 이미 팀원(E-16), 추방자 재초대 허용(E-13)"
  inviteMember(teamId: ID!, githubLogin: String!): SentInvitation!
  "TM-06 ③ [취소]. DB에 철회 상태값이 없어 행 삭제로 해석 (추측)"
  cancelInvitation(invitationId: ID!): ID!
  "TM-04 ②③. E-17 · E-18"
  respondInvitation(invitationId: ID!, accept: Boolean!): RespondInvitationPayload!
  "TM-05 ④ 팀원만. 팀장은 LEADER_MUST_TRANSFER(E-19). 자진 탈퇴는 경고 유지(기능명세서 6장)"
  leaveTeam(teamId: ID!): ID!
  "TM-06 ⑤. 그 팀 경고 카테고리 제거 · 0이면 경고 소프트 삭제(E-22)"
  kickMember(teamId: ID!, memberId: ID!): Team!
  "TM-06 ⑥ 되돌릴 수 없음. 성공 후 조회자는 TM-06 권한을 잃는다"
  transferLeadership(teamId: ID!, memberId: ID!): Team!
  "TM-06 ⑦ 즉시 반영"
  setTeamVisibility(teamId: ID!, isPublic: Boolean!): Team!
  "TM-06 ⑨. 글은 남고 팀 연결만 해제(E-21), 카테고리 제거(E-22). 마지막 1인 팀장의 '나가기'도 이것(E-20 추측)"
  deleteTeam(teamId: ID!): ID!
  "TM-08 ④. E-44 · E-47"
  requestPersonalExemption(input: RequestPersonalExemptionInput!): PersonalExemptionRequest!

  # --- 게시판 ---------------------------------------------------------
  "BD-04 등록"
  createPost(input: CreatePostInput!): Post!
  "BD-04 수정. 작성자 또는 연결 팀 팀장"
  updatePost(id: ID!, input: UpdatePostInput!): Post!
  "BD-03 ④ 작성자 또는 관리자(AD-01 ②-5). 확정 판정 불변(E-28)"
  deletePost(id: ID!): ID!
  "BD-03 ⑫"
  addComment(postId: ID!, content: String!): Comment!
  "BD-03 ⑪ · TM-06 ⑧ 작성자 또는 팀장"
  updateComment(id: ID!, content: String!): Comment!
  "BD-03 ⑪ · AD-01 ②-5 작성자 또는 관리자"
  deleteComment(id: ID!): ID!

  # --- 프로필 ---------------------------------------------------------
  "PR-02 ③ 기본 이미지로. 파일 업로드는 REST(계약서 5장)"
  resetProfileImage: Member!

  # --- 관리자: 판정 (AD-01 대시보드) ----------------------------------
  "AD-01 ⑦ [재시도] · ⑨ [전체 재시도]. judgmentIds 생략 = 재시도 가능한 보류 전부. 확정 건은 건드리지 않는다(E-35)"
  rerunHeldJudgments(judgmentIds: [ID!]): RerunResult!
  "AD-01 ⑩ [정정하고 재계산]. 사유 필수. 연쇄 재계산(E-49 · E-50 · E-58 · E-60)"
  correctJudgment(input: CorrectJudgmentInput!): RecalcPayload!

  # --- 관리자: 경고 복구 · 벌칙 ---------------------------------------
  "AD-01 ②-1 ⑥ 되돌릴 수 없는 고정점(E-58). 경고 0 · 연속 0 [Q-10 ⓓ]"
  fulfillPenalty(memberId: ID!): RecalcPayload!
  "AD-01 ②-1 ⑧"
  restoreWarning(warningId: ID!, expectedBasis: String): RecalcPayload!

  # --- 관리자: 회원 · 관리자 승격 · 정지 -------------------------------
  "활성 일반 회원의 이용을 정지한다. 로그인과 기존 토큰이 막힌다. 관리자·본인은 불가"
  suspendMember(memberId: ID!): AdminMemberRow!
  "정지를 풀어 활성으로"
  unsuspendMember(memberId: ID!): AdminMemberRow!
  "활성 일반 회원을 관리자로 올린다. 현재 관리자만 할 수 있다"
  promoteToAdmin(memberId: ID!): AdminMemberRow!
  approveMember(memberId: ID!): AdminMemberRow!
  "확인 다이얼로그 후. 감사 기록 대상(기능명세서 9장)"
  rejectMember(memberId: ID!): AdminMemberRow!
  "거절 → 승인 대기로 되돌리기(AD-01 ②-2 ⑧)"
  revertMemberToPending(memberId: ID!): AdminMemberRow!

  # --- 관리자: 면제 ---------------------------------------------------
  "과거 주간이면 exemptionPeriodPreview를 먼저 거친다(AD-01 ②-3 ⑥, E-45)"
  createExemptionPeriod(input: ExemptionPeriodInput!): ExemptionPeriod!
  updateExemptionPeriod(id: ID!, input: ExemptionPeriodInput!): ExemptionPeriod!
  "[미결] 이미 판정된 주의 면제 기간을 지우면 그 주를 어떻게 판정할지 명세에 없다(계약서 9장 C-05)"
  deleteExemptionPeriod(id: ID!, expectedBasis: String): ID!
  "AD-01 ②-3 ⑦ [승인]. 소급이면 미리보기 후 (추측)"
  approvePersonalExemption(requestId: ID!, expectedBasis: String): PersonalExemptionRequest!
  "거절 사유 필수(E-48 제안)"
  rejectPersonalExemption(requestId: ID!, reason: String!): PersonalExemptionRequest!

  # --- 관리자: 공지 ---------------------------------------------------
  createNotice(input: NoticeInput!): Notice!
  updateNotice(id: ID!, input: NoticeInput!): Notice!
  "isSystem이면 SYSTEM_NOTICE_UNDELETABLE(EX-AD01-02)"
  deleteNotice(id: ID!): ID!
  "AD-01 ②-4 ⑥ 고정 ON/OFF 즉시 토글"
  setNoticePinned(id: ID!, pinned: Boolean!): Notice!
}
